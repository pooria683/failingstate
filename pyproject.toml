[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failingstate"
version = "0.1.0"
description = "A local, persistent identity and history for test failures"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pytest>=7"]

[project.scripts]
fstate = "failingstate.cli:main"

[project.entry-points.pytest11]
failingstate = "failingstate.plugin"

[tool.setuptools.packages.find]
include = ["failingstate*"]
